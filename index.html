<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="MDM 模擬" />
  <title>MDM 門禁模擬</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --green-bg: #3dd80f;
      --pill-green: #6ee04d;
      --yellow-bg: #f5f50d;
      --ink: rgba(0, 0, 0, 0.88);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      background: #000;
      overflow: hidden;
    }
    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .screen.active { display: flex; }
    .green-screen { background: var(--green-bg); }
    .yellow-screen { background: var(--yellow-bg); }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 17px;
    }
    .top-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .spacer-btn { width: 64px; }

    .ios-tag {
      text-align: right;
      padding: 6px 14px 0;
      font-size: 12px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .status-sub {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 8px;
    }
    .center-grow {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
    }
    .camp-title {
      font-size: 44px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 18px;
      letter-spacing: 2px;
    }
    .live-clock {
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      margin-bottom: 18px;
    }
    .pill-row {
      width: 100%;
      background: var(--pill-green);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 11px;
    }
    .dot-green { width: 14px; height: 14px; border-radius: 50%; background: #18a818; }
    .dot-red { width: 14px; height: 14px; border-radius: 50%; background: #e51c23; }

    .white-label-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.93);
      border: none;
      border-radius: 12px;
      padding: 15px 12px;
      margin-top: 8px;
      margin-bottom: 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .white-label-line1, .white-label-line2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.35;
    }
    .white-label-serial {
      font-size: 29px;
      font-weight: 900;
      color: #111;
      margin-top: 2px;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }
    .footer-meta {
      text-align: center;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.5;
      padding-bottom: 16px;
      font-variant-numeric: tabular-nums;
    }
    .footer-warn {
      color: #d61c1c;
      font-weight: 800;
    }

    /* 選擇彈窗 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%;
      background: #73e64c;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    }
    .modal-title { font-size: 17px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
    .modal-sub { font-size: 14px; color: var(--ink); margin-bottom: 14px; }
    .modal-btn {
      width: 100%;
      background: rgba(255,255,255,0.38);
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
      cursor: pointer;
    }
    .modal-btn:last-child { margin-bottom: 0; }

    /* QR 畫面 */
    .qr-action-title {
      font-size: 38px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 22px;
    }
    .qr-box {
      background: #fff;
      padding: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #qrcode img, #qrcode canvas {
      display: block;
      width: 220px !important;
      height: 220px !important;
    }
    .refresh-btn {
      margin-top: 18px;
      margin-bottom: 22px;
      background: none;
      border: none;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .qr-meta {
      text-align: center;
      font-size: 14px;
      color: var(--ink);
      line-height: 1.65;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- 主畫面 -->
  <section id="mainScreen" class="screen green-screen active">
    <div class="topbar">
      <button class="top-btn" onclick="editID()">☰</button>
      <div>國軍 MDM V9.1</div>
      <div class="spacer-btn"></div>
    </div>

    <div class="ios-tag">iOS:27.2</div>
    <div class="status-sub">已上鎖，可進入此管制營區</div>

    <div class="center-grow">
      <div class="camp-title" id="campName">武漢營區</div>
      <div class="live-clock" id="liveClock">115/11/21 03:27:00</div>

      <div class="pill-row">
        <span class="dot-green"></span>
        <span>上鎖：進入管制模式</span>
      </div>
      <div class="pill-row">
        <span class="dot-red"></span>
        <span>解鎖：離開管制模式</span>
      </div>

      <button class="white-label-btn" onclick="openModal()">
        <div class="white-label-line1">國軍營內民用通信</div>
        <div class="white-label-line2">資訊器材管制標籤</div>
        <div class="white-label-serial" id="labelSerial">C228854719</div>
      </button>
    </div>

    <div class="footer-meta">
      <div>上鎖時間：<span id="lockTime">115/11/15 22:51:49</span></div>
      <div>設定檔：<span id="configVer">V3.1 (05/10 12:33:44)</span></div>
      <div class="footer-warn">仿冒必究</div>
    </div>
  </section>

  <!-- 選擇彈窗 -->
  <div id="actionModal" class="modal-backdrop" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">提示</div>
      <div class="modal-sub">請選擇產生 QRCode 類型</div>
      <button class="modal-btn" onclick="goQR('進入營區')">進入營區</button>
      <button class="modal-btn" onclick="goQR('離開營區')">離開營區</button>
      <button class="modal-btn" onclick="closeModal()">取 消</button>
    </div>
  </div>

  <!-- QRCode 畫面 -->
  <section id="qrScreen" class="screen yellow-screen">
    <div class="topbar">
      <button class="top-btn" onclick="backMain()">‹ 返回</button>
      <div>門禁 - QRCode</div>
      <div class="spacer-btn"></div>
    </div>

    <div class="center-grow">
      <div class="qr-action-title" id="qrActionTitle">進入營區</div>
      <div class="qr-box">
        <div id="qrcode"></div>
      </div>
      <button class="refresh-btn" onclick="refreshQR()">
        <span>↻</span>
        <span>更新 QRCode</span>
      </button>

      <div class="qr-meta">
        <div>時間來源： 手機</div>
        <div>來源時間：<span id="qrSourceTime">115/11/21 03:27:00</span></div>
        <div>上鎖時間：<span id="qrLockTime">115/11/15 22:51:49</span></div>
        <div>版本號：MDM 9.1 Build 1</div>
      </div>
    </div>
  </section>

  <script>
    let userID = localStorage.getItem("custom_id") || "J123219819";
    let qrInstance = null;

    function formatMinguo(date = new Date()) {
      const rocYear = date.getFullYear() - 1911;
      const pad = (n) => String(n).padStart(2, "0");
      return `${rocYear}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function updateClock() {
      document.getElementById("liveClock").textContent = formatMinguo(new Date());
    }

    function openModal() {
      document.getElementById("actionModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("actionModal").classList.remove("open");
    }

    function goQR(action) {
      closeModal();
      document.getElementById("qrActionTitle").textContent = action;
      document.getElementById("mainScreen").classList.remove("active");
      document.getElementById("qrScreen").classList.add("active");
      refreshQR();
    }

    function backMain() {
      document.getElementById("qrScreen").classList.remove("active");
      document.getElementById("mainScreen").classList.add("active");
    }

    function refreshQR() {
      document.getElementById("qrSourceTime").textContent = formatMinguo(new Date());
      const container = document.getElementById("qrcode");
      container.innerHTML = "";
      qrInstance = new QRCode(container, {
        text: userID,
        width: 220,
        height: 220,
        colorDark: "#111111",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function editID() {
      const nextID = prompt("輸入要產生的身分證字號：", userID);
      if (nextID && nextID.trim()) {
        userID = nextID.trim().toUpperCase();
        localStorage.setItem("custom_id", userID);
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
